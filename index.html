<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#dde9cf"><meta name="description" content="家：一款不赶时间的猫咪养成游戏。收养小猫，给它起名，和它一起过温柔的小日子。"><title>家 · 有猫的日子</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="immersive.css?v=home2"></head>
<body class="immersive"><main id="game-stage" aria-label="家 · 猫咪养成游戏"><canvas id="world" aria-label="动态猫咪场景"></canvas><div id="cat-hitboxes"></div>
<header class="game-hud"><div class="game-logo"><span>🐾</span><div>家<small>有你，有猫，就是家</small></div></div><div class="hud-resources"><span>✧ <b id="coins">0</b></span><button id="save-info" aria-label="存档与帮助">⚙</button></div></header>
<div class="room-badge"><span id="room-icon">🌿</span><div><b id="room-name">阳光小院</b><small id="room-description">风轻轻，猫慢慢</small></div><span class="weather">☀ 23°</span></div>
<div class="game-status"><span>♡ <b id="resident-count">1</b> 位小家人</span><span>🐾 <b id="visitor-count">0</b> 位新朋友</span></div>
<button id="collect" class="gift-button">🎁 小猫的礼物</button><div id="scene-hint" class="scene-hint">点点小猫，陪它待一会 · 点击房门可以进入</div>
<div class="game-controls"><nav class="room-nav" aria-label="探索家园"><button data-room="yard" class="selected"><span>🌿</span>小院</button><button data-room="balcony"><span>🌼</span>阳台</button><button data-room="living"><span>🛋</span>客厅</button><button data-room="bedroom"><span>🛏</span>卧室</button><button data-room="kitchen"><span>🍳</span>厨房</button><button data-room="catroom"><span>🧺</span>猫窝</button></nav><nav class="game-actions" aria-label="养成菜单"><button data-tab="cats"><span>🐱</span>小家人</button><button data-tab="shop"><span>🪴</span>布置</button><button data-tab="memories"><span>📖</span>回忆</button><button id="call-cats"><span>🐟</span>召唤小猫</button></nav></div>
</main><dialog id="collection"><div class="modal-top"><h2 id="collection-title">小家人</h2><button id="close-collection" class="close" aria-label="关闭列表">×</button></div><div id="panel"></div></dialog><dialog id="modal"><div id="modal-content"></div></dialog><div id="toast" role="status"></div><input id="import-file" type="file" accept="application/json" hidden><div hidden><button id="export-save">导出存档</button><button id="import-save">导入存档</button></div><script src="game.js?v=home3"></script><script src="art.js?v=home3"></script><script src="scene.js?v=home3"></script><script src="app.js?v=home3"></script></body></html>
